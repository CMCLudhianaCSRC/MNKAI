[project]
name = "mnkai"
version = "0.2.0"
description = "MNKAI: research-grade dermatology classifier with group-aware evaluation, focused on Indian skin tones"
requires-python = ">=3.11,<3.13"
readme = "README.md"

dependencies = [
    # Core DL
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0.11",
    # Data
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "Pillow>=10.4",
    "opencv-python>=4.10",
    "albumentations>=1.4.10",
    "imagehash>=4.3",
    # Logging / config
    "pyyaml>=6.0",
    "loguru>=0.7",
    "tqdm>=4.66",
    "tensorboard>=2.17",
    "rich>=13.7",
    # Eval / stats
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Downloaders
    "requests>=2.32",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17"]
report = ["reportlab>=4.2"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnkai"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
