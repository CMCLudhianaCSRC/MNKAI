name: CI

# Data-free continuous integration: lint + byte-compile smoke over the source,
# then the (data-free) pytest suite. No training, no feature extraction, no image
# drive, no large downloads — everything here runs on cached-nothing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-smoke:
    name: lint + compile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.6,<1"
      # Repo-wide lint is scoped to the maintained reproducibility/QC infra + tests:
      # the legacy science scripts carry a large pre-existing lint debt that is out of
      # scope to mass-rewrite here (tracked separately). Syntax of the *whole* tree is
      # still gated by the compile smoke below.
      - name: Ruff lint (reproducibility/QC infra + tests)
        run: |
          ruff check \
            scripts/qc_checks.py scripts/reproduce.py \
            src/mnkai/utils/run_manifest.py \
            tests/test_qc_checks.py tests/test_run_manifest.py
      - name: Byte-compile smoke over the whole tree (fails on any syntax error)
        run: python -m compileall -q src scripts

  tests:
    name: pytest (data-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core deps (CPU-only torch; skip the heavy VLM/finetune stack)
        run: |
          python -m pip install --upgrade pip
          # CPU wheels keep the runner fast; the science stack only needs CPU here.
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.2,<3" "torchvision>=0.17,<1"
          pip install \
            "numpy>=1.26,<3" "scipy>=1.12,<2" "scikit-learn>=1.4,<2" \
            "pandas>=2.2,<4" "Pillow>=10.4,<13" "pyyaml>=6.0.2,<7" \
            "loguru>=0.7,<1" "timm>=1.0.7,<2" "matplotlib>=3.8,<4" \
            "pytest>=8.0,<9"
      - name: Run the data-free test suite
        env:
          PYTHONPATH: src
        # Tests that need an optional dep (or real data) self-skip via
        # pytest.importorskip; nothing here reads the image drive.
        run: pytest -q tests
