# ============================================================
# MNKAI-III  Training Config v2  — RTX 4050 6GB  |  55k→100k+ imgs
# ============================================================
# Model: EfficientNetV2-M (best trade-off: acc vs VRAM for 6GB)
# Alt:   convnext_base (slightly better, same VRAM)
# NOT:   ViT-L (too large for 6GB without fp16 tricks)
# ============================================================

experiment:
  name: "mnkai3_8class_v2"
  seed: 42
  output_dir: "runs/mnkai3_8class_v2"

# ── Data ────────────────────────────────────────────────────
data:
  splits_csv:  "data/splits/master_splits.csv"
  image_size:  224           # upgrade to 384 in fine-tune phase
  num_workers: 4             # safe for 16GB RAM + 6GB VRAM laptop
  pin_memory:  true
  prefetch_factor: 2

  # Oversample minority classes within each batch
  use_weighted_sampler: true
  sampler_pow: 0.5           # sqrt of inverse frequency (softer than full inverse)

  # Per-class hard caps for this training phase
  # (prevent nv from dominating even after weighting)
  class_cap:
    nv:   12000              # cap dominant class
    bcc:   9455              # keep all
    mel:   8988
    bkl:   5988
    scc:   1619
    ak:    1458
    df:     727
    vasc:   318

# ── Model ───────────────────────────────────────────────────
model:
  backbone: "tf_efficientnetv2_m"   # timm name; 54M params, 384-native
  pretrained: true
  pretrained_source: "imagenet22k"  # superior init vs imagenet1k
  num_classes: 8
  drop_rate: 0.3
  drop_path_rate: 0.2
  # Freeze stem+first 2 blocks for first 5 epochs, then unfreeze all
  frozen_stages: 2
  unfreeze_epoch: 5

# ── Training ────────────────────────────────────────────────
training:
  epochs:        50
  batch_size:    32           # safe for 6GB VRAM at 224px; use 16 at 384px
  grad_accum:    2            # effective batch = 64
  precision:     "fp16"       # cuts VRAM in half, enables larger batches
  compile:       false        # torch.compile — enable if torch>=2.0 + stable

  optimizer:
    name:         "adamw"
    lr:           3.0e-4
    weight_decay: 0.05
    betas:        [0.9, 0.999]

  scheduler:
    name:         "cosine_with_warmup"
    warmup_epochs: 5
    min_lr:       1.0e-6
    t_max:        45           # total epochs minus warmup

  # EMA — free ~0.5-1% AUC, already in mnkai/training/ema.py
  ema:
    enabled: true
    decay:   0.9998

  gradient_clip: 1.0
  label_smoothing: 0.1

# ── Loss ────────────────────────────────────────────────────
loss:
  name: "focal"               # mnkai/losses/focal.py — handles imbalance
  gamma: 2.0
  alpha: null                 # set to per-class weights if focal alone insufficient
  # Per-class weights (inverse sqrt frequency, then normalized)
  # auto-computed at runtime from training split counts
  use_class_weights: true
  class_weight_pow: 0.5       # sqrt inverse: softer than full inverse

# ── Augmentation ────────────────────────────────────────────
augmentation:
  train:
    - RandomResizedCrop:
        size: 224
        scale: [0.7, 1.0]
        ratio: [0.9, 1.1]
    - HorizontalFlip:
        p: 0.5
    - VerticalFlip:
        p: 0.5
    - RandomRotate90:
        p: 0.5
    - ColorJitter:
        brightness: 0.3
        contrast:   0.3
        saturation: 0.3
        hue:        0.05
        p: 0.8
    - ElasticTransform:
        alpha: 120
        sigma: 6
        p: 0.3
    - GridDistortion:
        p: 0.3
    - CoarseDropout:
        max_holes: 8
        max_height: 32
        max_width:  32
        p: 0.3
    - Normalize:
        mean: [0.485, 0.456, 0.406]   # ImageNet stats (good proxy)
        std:  [0.229, 0.224, 0.225]

  val:
    - Resize:    {size: 224}
    - CenterCrop:{size: 224}
    - Normalize:
        mean: [0.485, 0.456, 0.406]
        std:  [0.229, 0.224, 0.225]

# ── Evaluation ──────────────────────────────────────────────
evaluation:
  primary_metric: "balanced_accuracy"   # handles class imbalance
  also_track: ["auc_macro", "f1_macro", "per_class_auc"]

  # TTA at final eval — already in mnkai/evaluation/tta.py
  tta:
    enabled: true
    n_augments: 5    # 5-crop TTA for final score

  external_test: true          # always evaluate on MSK holdout at end

# ── K-Fold ──────────────────────────────────────────────────
cross_validation:
  k_folds:       5
  train_all_folds: true        # train all 5, ensemble at test time
  fold_ensemble_strategy: "mean_probs"

# ── Hardware ────────────────────────────────────────────────
hardware:
  device:     "cuda"
  gpu_id:     0
  mixed_precision: true        # AMP fp16
  # Memory estimates at 224px batch_size=32 fp16:
  #   EfficientNetV2-M: ~3.5 GB  ← safe
  #   EfficientNetV2-L: ~5.2 GB  ← tight
  #   ConvNeXt-Base:    ~3.8 GB  ← safe
  #   ViT-B/16:         ~4.1 GB  ← safe
  #   ViT-L/16:         ~7.5 GB  ← OOM

# ── Checkpointing ───────────────────────────────────────────
checkpointing:
  save_every_n_epochs: 5
  save_best: true
  monitor: "val_balanced_accuracy"
  mode: "max"
  keep_top_k: 3

# ── Logging ─────────────────────────────────────────────────
logging:
  backend: "loguru"            # already set up
  log_every_n_steps: 50
  # Optional: tensorboard
  tensorboard: true
  tensorboard_dir: "runs/mnkai3_8class_v2/tb"

# ============================================================
