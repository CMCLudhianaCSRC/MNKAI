seed: 42

logging:
  level: DEBUG
  log_dir: logs
  log_file: dermdesk.log

hardware:
  num_workers: 4
  mixed_precision: true
  cudnn_benchmark: true
  torch_compile: false
  allow_tf32: true
  pin_memory: true
  prefetch_factor: 2

# ===== DATA =====
data:
  # If you train from images + a CSV with 'filepath' and 'label':
  metadata_csv: data/manifest_subset_120k.csv
  images_dir: ""            # leave empty if metadata_csv.filepath is absolute
  folds_file: data/folds.csv   # optional; created by scripts/make_folds.py
  group_column: ""             # optional (e.g., lesion_id to avoid leak)

  cache_dir: ./cache
  img_size: 384

  hair_removal: true
  hair_removal_max_side: 768

  # Normalization — change to ImageNet if your training used it
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std:  [0.229, 0.224, 0.225]

classes:
  # Canonical names (order = class indices)
  names: [mel, nv, bcc, scc, df, bkl, ak, vasc]

  # Aliases to auto-map free-text diagnosis to these names (if you feed diagnosis)
  aliases:
    mel:  ["mel", "melanoma", "melanoma in situ", "superficial spreading melanoma", "nodular melanoma", "lentigo maligna", "lentigo malignant melanoma", "acral lentiginous melanoma", "mucosal melanoma", "mm", "melanocytic malignant"]
    nv:   ["nv", "nevus", "naevus", "melanocytic nevus", "common nevus", "atypical nevus", "dysplastic nevus", "compound nevus", "intradermal nevus", "junctional nevus", "melanocytic nevi"]
    bcc:  ["bcc", "basal cell carcinoma", "basalioma"]
    scc:  ["scc", "squamous cell carcinoma", "keratinocyte carcinoma", "squamous carcinoma", "akiec_scc"]
    df:   ["df", "dermatofibroma", "histiocytoma"]
    bkl:  ["bkl", "benign keratosis", "seborrheic keratosis", "solar lentigo", "lentigo", "lichen planus-like keratosis", "lplk", "sk", "sebk"]
    ak:   ["ak", "actinic keratosis", "akiec", "actinic keratoses"]
    vasc: ["vasc", "vascular", "angioma", "hemangioma", "pyogenic granuloma", "venous lake", "vascular lesion"]
  ignore: ["ns", "normal", "none", "no lesion", "undetermined", "other", "unknown"]

# ===== TRAIN =====
train:
  model_name: tf_efficientnet_b4_ns        # or convnext_tiny, etc.
  pretrained: true

  epochs: 50
  lr: 2.5e-4
  weight_decay: 1.0e-4

  scheduler: cosine         # cosine, step, or plateau
  warmup_epochs: 3

  batch_size: 8
  grad_accum_steps: 4

  loss: focal               # focal or ce
  label_smoothing: 0.10
  focal_alpha: 0.25
  focal_gamma: 2.0

  mixup_alpha: 0.2          # 0 to disable
  tta_valid: true           # H, V, HV flips on validation

  ema: true
  ema_decay: 0.999

  swa: true                 # Stochastic Weight Averaging (final 20% epochs)
  swa_start_frac: 0.8

  fold_index: 0             # set -1 to ignore folds.csv and do an 80/20 split
  k_folds: 5
  early_stopping_patience: 10
  save_top_k: 2

  log_every_n_steps: 25
  checkpoint_every_n_steps: 200
  target_macro_f1: 0.70

  resume: ""                # e.g., checkpoints/best_fold0.pth to continue

tensorboard:
  enabled: true
  log_dir: runs

deploy:
  apply_temperature: true
  temperature_file: checkpoints/temperature.json
  abstain_threshold: 0.55
