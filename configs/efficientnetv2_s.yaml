_base_: base.yaml

# EfficientNetV2-S (~21M params) — second ensemble member.
out_dir: checkpoints/effnetv2s_fold0

data:
  img_size: 384

train:
  model_name: tf_efficientnetv2_s.in21k_ft_in1k
  batch_size: 16
  grad_accum_steps: 2
  epochs: 35
  lr: 2.5e-4
  weight_decay: 1.0e-4
  drop_rate: 0.20
  drop_path_rate: 0.20
  loss: cb_focal
  focal_gamma: 2.0
