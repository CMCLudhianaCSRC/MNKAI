<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>3D CNN Viewer</title>
  <style>body,html{margin:0;height:100%;overflow:hidden;background:#0b1020;}#ui{position:fixed;top:10px;left:10px;color:#fff;font:14px sans-serif}</style>
</head>
<body>
<div id="ui">
  <div id="info">Loading…</div>
  <input id="alpha" type="range" min="0" max="1" step="0.01" value="0.9"> opacity
  <input id="gap" type="range" min="1" max="20" step="1" value="6"> gap
</div>
<script src="https://unpkg.com/three@0.157.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.157.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function(){
  const resp = await fetch("../viz_assets/layers.json");
  const meta = await resp.json();
  const LAYERS = meta.layers;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 5000);
  camera.position.set(0, 0, 400);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  const group = new THREE.Group(); scene.add(group);
  const loader = new THREE.TextureLoader();

  let opacity = 0.9, gap = 6;

  function build() {
    group.clear();
    let z = 0;
    for (const L of LAYERS) {
      const tex = loader.load("../viz_assets/" + L.file);
      tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
      const geo = new THREE.PlaneGeometry(256,256);
      const mat = new THREE.MeshBasicMaterial({map: tex, transparent:true, opacity:opacity, depthWrite:false});
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.z = -z;
      group.add(mesh);
      z += gap;
    }
    document.getElementById("info").textContent = `${meta.model} • slices: ${LAYERS.length}`;
  }

  build();

  addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  const alpha = document.getElementById('alpha');
  alpha.oninput = ()=>{ opacity=parseFloat(alpha.value); build(); };
  const gapSlider = document.getElementById('gap');
  gapSlider.oninput = ()=>{ gap=parseFloat(gapSlider.value); build(); };

  (function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
})();
</script>
</body>
</html>
